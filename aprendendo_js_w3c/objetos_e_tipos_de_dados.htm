	const Person = {
		// Propriedades ou atributos

	 	age : "18",	
	 	eyeColor : "castanhos",

	 	// Métodos do objetos

	 	}

	delete Person.hair;

document.getElementById('obj').innerHTML = Person.fullName()  + " tem "+ Person.age + " anos e olhos " +Person['eyeColor'] + " " + Person.hair;
	
	// Exibição de Objeto JS

	const carro = {
		nome: 'Gol quadrado',

	};

document.getElementById('obj_nome').innerHTML = carro.nome + " é da marca " + carro.marca + ", sua cor é " + carro.cor + " e é de " + carro.ano;

	let paragrafo = "";

	};

document.getElementById('obj_loop').innerHTML = paragrafo;

	const myArray = Object.values(carro);

	const convertionString = JSON.stringify(carro);

	// Construct function - ajuda a criar objetos do mesmo tipo
	function Pessoa(nome, sobrenome, idade, altura){
		// Propriedades
		this.primeiroNome = nome;
		this.sobreNome = sobrenome;
		this.idadePessoa = idade;
		this.alturaPessoa = altura;
		// Método
		this.nomeCompleto = function () {
			return this.primeiroNome +" "+ this.sobreNome;
		}
	}
const meuIrmao = new Pessoa('Marcos', 'Barros ', 24, 178);
const minhaIrma = new Pessoa('Jéssica', 'Barros', 33, 155);


document.getElementById('constructor').innerHTML = "O nome do meu irmão é  " + meuIrmao.nomeCompleto();

document.getElementById('constructor_prototype_method').innerHTML = minhaIrma.characters();

	Pessoa.prototype.nacionalidade = "Brasileiro(a)";
